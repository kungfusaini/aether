services:
  plausible_db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: plausible_db
    volumes:
      - plausible-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=plausible
    networks:
      - aether-network

  plausible_events_db:
    image: clickhouse/clickhouse-server:24.3.3.102-alpine
    restart: unless-stopped
    container_name: plausible_events_db
    volumes:
      - plausible-event-data:/var/lib/clickhouse
      - plausible-event-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - aether-network

  plausible:
    image: ghcr.io/plausible/community-edition:v2.1.4
    restart: unless-stopped
    container_name: plausible
    command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      - plausible_db
      - plausible_events_db
    environment:
      - SECRET_KEY_BASE=${PLAUSIBLE_SECRET_KEY_BASE}
      - DATABASE_URL=postgres://postgres:postgres@plausible_db:5432/plausible
      - CLICKHOUSE_DATABASE_URL=http://plausible_events_db:8123/default
      - BASE_URL=${PLAUSIBLE_BASE_URL:-http://stats.localhost}
      - DISABLE_REGISTRATION=${PLAUSIBLE_DISABLE_REGISTRATION:-false}
    networks:
      - aether-network

volumes:
  plausible-db-data:
  plausible-event-data:
  plausible-event-logs:

networks:
  aether-network:
    external: true
