# Development Upstreams
upstream sumeetsaini_com_dev {
    server sumeetsaini_com:8080;
}

upstream vulkan_api_dev {
    server vulkan:3000;
}

upstream arcanecodex_dev {
    server arcanecodex:1313;
}

# Main website - Development
server {
    listen 80;
    server_name localhost;
    
    location / {
        proxy_pass http://sumeetsaini_com_dev/;
    }
    
    location /ws {
        proxy_pass http://sumeetsaini_com_dev/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /vulkan/ {
        proxy_pass http://vulkan_api_dev/;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }

}

# API - Development (subdomain access)
server {
    listen 80;
    server_name vulkan.localhost;
    
    location / {
        proxy_pass http://vulkan_api_dev/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Arcane Codex - Development (subdomain access)
server {
    listen 80;
    server_name arcanecodex.localhost;
    
    location / {
        proxy_pass http://arcanecodex_dev/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}