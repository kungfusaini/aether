# Main website - Development
server {
    listen 80;
    server_name localhost;
    
    location / {
        proxy_pass http://sumeetsaini_com_dev/;
    }
    
    location /ws {
        proxy_pass http://sumeetsaini_com_dev/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /vulkan/ {
        proxy_pass http://vulkan_api_dev/;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }

}

# API - Development (subdomain access)
server {
    listen 80;
    server_name vulkan.localhost;
    
    location / {
        proxy_pass http://vulkan_api_dev/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Arcane Codex - Development (subdomain access)
server {
    listen 80;
    server_name arcanecodex.localhost;
    
    location / {
        # CORS headers for development - dynamic origin matching
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length "0";
            add_header Content-Type "text/plain";
            return 204;
        }
        
        proxy_pass http://arcanecodex_dev/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}