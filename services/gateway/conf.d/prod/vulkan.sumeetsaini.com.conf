# API - Production (HTTPS)

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name vulkan.sumeetsaini.com;
    return 301 https://$server_name$request_uri;
}

# API - Production (HTTPS)
server {
    listen 443 ssl;
    server_name vulkan.sumeetsaini.com;
    
    # security configuration
    include /etc/nginx/conf.d/common/security.conf;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/vulkan.sumeetsaini.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vulkan.sumeetsaini.com/privkey.pem;
    
    location / {
        proxy_pass http://vulkan_api_prod;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }
    
    # Projects API - add CORS headers (prefix match for images/videos)
    location /projects/ {
        proxy_pass http://vulkan_api_prod;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    }
}