# Plausible Analytics - Production (HTTPS)

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name stats.sumeetsaini.com;

    # ACME challenge for certbot renewal (must come before redirect)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Plausible Analytics - Production (HTTPS)
server {
    listen 443 ssl;
    server_name stats.sumeetsaini.com;

    # security configuration
    include /etc/nginx/conf.d/common/security.conf;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/stats.sumeetsaini.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.sumeetsaini.com/privkey.pem;

    location / {
        proxy_pass http://plausible_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for LiveView
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}