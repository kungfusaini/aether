# Arcane Codex - Production (HTTPS)

server {
    listen 80;
    listen [::]:80;
    server_name arcanecodex.dev www.arcanecodex.dev;

    # ACME challenge for certbot renewal (must come before redirect)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name arcanecodex.dev www.arcanecodex.dev;
    
    # security configuration
    include /etc/nginx/conf.d/common/security.conf;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/arcanecodex.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcanecodex.dev/privkey.pem;

    location /stats/ {
        proxy_pass http://plausible_prod/;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }

    location /api/event {
        proxy_pass http://plausible_prod/api/event;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }

    location / {
        # Handle preflight OPTIONS requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://sumeetsaini.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Content-Length "0";
            add_header Content-Type "text/plain";
            return 204;
        }

        # Proxy to arcanecodex container
        proxy_pass http://arcanecodex_prod;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hide CORS headers from backend to prevent duplicates
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        # CORS headers for proxied responses
        add_header Access-Control-Allow-Origin "https://sumeetsaini.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }
}