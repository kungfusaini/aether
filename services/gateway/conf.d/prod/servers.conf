# Arcane Codex - Production (HTTPS)
server {
    listen 80;
    server_name arcanecodex.dev www.arcanecodex.dev arcanecodex.com www.arcanecodex.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name arcanecodex.dev www.arcanecodex.dev;
    
    # security configuration
    include /etc/nginx/conf.d/common/security.conf;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/arcanecodex.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcanecodex.dev/privkey.pem;

    location / {
        # Proxy to the arcanecodex container
        proxy_pass http://arcanecodex_prod; 
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name arcanecodex.com www.arcanecodex.com;
    
    # security configuration
    include /etc/nginx/conf.d/common/security.conf;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/arcanecodex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcanecodex.com/privkey.pem;

    location / {
        # Proxy to the arcanecodex container
        proxy_pass http://arcanecodex_prod; 
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Mail - Production (HTTPS)

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name mail.sumeetsaini.com;
    return 301 https://$server_name$request_uri;
}

# Mail - Production (HTTPS)
server {
    listen 443 ssl;
    server_name mail.sumeetsaini.com;
    
    # security configuration
    include /etc/nginx/conf.d/common/security.conf;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/mail.sumeetsaini.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.sumeetsaini.com/privkey.pem;
    
    location / {
        proxy_pass http://mailcow_nginx;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for SOGo
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}