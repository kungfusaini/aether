# Main website - Production (HTTPS)

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name sumeetsaini.com www.sumeetsaini.com;
    return 301 https://$server_name$request_uri;
}

# Main website - Production (HTTPS)
server {
    listen 443 ssl;
    server_name sumeetsaini.com www.sumeetsaini.com;
    
    # security configuration
    include /etc/nginx/conf.d/common/security.conf;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/sumeetsaini.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sumeetsaini.com/privkey.pem;
    
    location / {
        proxy_pass http://sumeetsaini_com_prod;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }
    
    location /vulkan/ {
        # Allow only from your own domain (internal access)
        valid_referers sumeetsaini.com *.sumeetsaini.com;
        if ($invalid_referer) {
            return 403;
        }
        proxy_pass http://vulkan_api_prod/;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }
}

