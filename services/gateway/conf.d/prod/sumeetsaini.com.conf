# Main website - Production (HTTPS)

# HTTP to HTTPS redirect (both domains)
server {
    listen 80;
    listen [::]:80;
    server_name sumeetsaini.com www.sumeetsaini.com;

    # ACME challenge for certbot renewal (must come before redirect)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://sumeetsaini.com$request_uri;
    }
}

# WWW to non-WWW redirect (HTTPS only)
server {
    listen 443 ssl;
    server_name www.sumeetsaini.com;
    
    # security configuration
    include /etc/nginx/conf.d/common/security.conf;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/sumeetsaini.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sumeetsaini.com/privkey.pem;
    
    return 301 https://sumeetsaini.com$request_uri;
}

# Main website - Production (HTTPS only, non-WWW)
server {
    listen 443 ssl;
    server_name sumeetsaini.com;
    
    # security configuration
    include /etc/nginx/conf.d/common/security.conf;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/sumeetsaini.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sumeetsaini.com/privkey.pem;
    
    location / {
        proxy_pass http://sumeetsaini_com_prod;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }

    # Loader with hardcoded content list — contents change without URL changing,
    # so the browser must revalidate every request instead of using the long cache.
    location = /js/now/nowLoader.js {
        proxy_pass http://sumeetsaini_com_prod;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Long cache for versioned static assets
    location ~* \.(js|css|woff2|png|jpg|jpeg|gif|ico|svg|webp|mp4)$ {
        proxy_pass http://sumeetsaini_com_prod;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /stats/ {
        proxy_pass http://plausible_prod/;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }

    location /api/event {
        proxy_pass http://plausible_prod/api/event;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }

    location /vulkan/ {
        # Allow only from your own domain (internal access)
        valid_referers sumeetsaini.com *.sumeetsaini.com;
        if ($invalid_referer) {
            return 403;
        }
        proxy_pass http://vulkan_api_prod/;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }
}