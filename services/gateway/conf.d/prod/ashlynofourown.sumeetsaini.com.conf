server {
    listen 80;
    server_name ashlynofourown.sumeetsaini.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name ashlynofourown.sumeetsaini.com;
    
    include /etc/nginx/conf.d/common/security.conf;
    
    ssl_certificate /etc/letsencrypt/live/ashlynofourown.sumeetsaini.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ashlynofourown.sumeetsaini.com/privkey.pem;
    
    location / {
        proxy_pass http://ao3_prod;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }
}