# babbi.world - Production (HTTPS)

server {
    listen 80;
    listen [::]:80;
    server_name babbi.world www.babbi.world;

    # ACME challenge for certbot renewal (must come before redirect)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://babbi.world$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name babbi.world www.babbi.world;

    # security configuration
    include /etc/nginx/conf.d/common/security.conf;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/babbi.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/babbi.world/privkey.pem;

    location / {
        proxy_pass http://babbi_world_prod;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }
}
