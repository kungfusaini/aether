# Reliq Labs - Production (HTTPS)

server {
    listen 80;
    listen [::]:80;
    server_name reliqlabs.com www.reliqlabs.com;

    # ACME challenge for certbot renewal (must come before redirect)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://reliqlabs.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name reliqlabs.com www.reliqlabs.com;
    
    # security configuration
    include /etc/nginx/conf.d/common/security.conf;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/reliqlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reliqlabs.com/privkey.pem;

    location / {
        proxy_pass http://reliqlabs_prod;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }

    location /stats/ {
        proxy_pass http://plausible_prod/;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }

    location /api/event {
        proxy_pass http://plausible_prod/api/event;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }

    location /vulkan/ {
        # Allow only from your own domain (internal access)
        valid_referers reliqlabs.com *.reliqlabs.com;
        if ($invalid_referer) {
            return 403;
        }
        proxy_pass http://vulkan_api_prod/;
        include /etc/nginx/conf.d/common/proxy-headers.conf;
    }
}
