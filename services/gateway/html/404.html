<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <style>
        @font-face {
            font-family: "ProFontIIx";
            src: url("https://sumeetsaini.com/fonts/ProFontIIxNerdFontMono-Regular.woff2") format("woff2");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --black-grey: #1d2021;
            --dark-grey: #282828;
            --mid-grey: #3c3836;
            --light-grey: #504945;
            --lighter-grey: #665c54;
            --cream: #fbf1c7;
            --orange: #d65d03;
            --font-mono: "ProFontIIx", "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-mono);
            background: var(--dark-grey);
            color: var(--cream);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .error-code {
            font-size: clamp(4rem, 15vw, 12rem);
            color: var(--orange);
            line-height: 1;
            margin-bottom: 1rem;
            text-shadow: 0 0 40px rgba(214, 93, 3, 0.3);
        }

        .message {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: var(--cream);
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .sub-message {
            font-size: 1rem;
            color: var(--light-grey);
            margin-bottom: 3rem;
        }

        .home-link {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--orange);
            color: var(--cream);
            text-decoration: none;
            font-size: 1rem;
            border-radius: 4px;
            transition: all 0.3s ease;
            border: 2px solid var(--orange);
        }

        .home-link:hover {
            background: transparent;
            color: var(--orange);
        }
    </style>
</head>
<body>
    <div class="error-code">404</div>
    <div class="message">You are not supposed to be here!</div>
    <div class="sub-message">This subdomain doesn't exist or has been moved.</div>
    <a href="https://sumeetsaini.com" class="home-link">Go Home</a>
</body>
</html>
