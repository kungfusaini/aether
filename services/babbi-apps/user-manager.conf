# Installed as /etc/systemd/system/user@2000.service.d/babbi-apps.conf.
# UID 2000 is reserved for babbi-apps; no existing user manager is changed.
[Unit]
RequiresMountsFor=/home/babbi-apps
Requires=babbi-apps-egress.service
After=babbi-apps-egress.service

[Service]
Delegate=cpu cpuset io memory pids
ProtectSystem=strict
ProtectHome=tmpfs
BindPaths=/home/babbi-apps /run/user/2000 /dev/net/tun
ReadWritePaths=/home/babbi-apps /run/user/2000
InaccessiblePaths=-/var/www/containers -/opt/mailcow-dockerized -/run/secrets -/run/docker.sock -/var/lib/docker -/var/lib/containerd
TemporaryFileSystem=/tmp:rw,nosuid,nodev,mode=1777,size=32M /var/tmp:rw,nosuid,nodev,mode=1777,size=32M
PrivateDevices=yes
DeviceAllow=/dev/net/tun rw
LogRateLimitIntervalSec=30s
LogRateLimitBurst=500
