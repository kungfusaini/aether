# Installed as babbi-apps' ~/.config/systemd/user/docker.service.d/network.conf.
# Docker 29 enables detached-netns by default. In this hardened workspace it
# breaks embedded DNS forwarding; keep the pre-29 isolated daemon network.
# This is the upstream compatibility switch, not a firewall exception.
[Service]
Environment=DOCKERD_ROOTLESS_ROOTLESSKIT_DETACH_NETNS=false
