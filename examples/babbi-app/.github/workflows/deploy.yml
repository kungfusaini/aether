name: Deploy app
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: babbi-app-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      APP_NAME: ${{ vars.BABBI_APP_NAME }}
      APP_PORT: ${{ vars.BABBI_APP_PORT || '80' }}
    steps:
      - uses: actions/checkout@v4
      - name: Choose image namespace
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Deploy to her rootless workspace
        env:
          PORTAINER_URL: https://apps.babbi.world
          PORTAINER_TOKEN: ${{ secrets.BABBI_APPS_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: python3 deploy.py --name "$APP_NAME" --image "$IMAGE" --port "$APP_PORT"
      - name: Check public app health
        run: curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 --max-time 10 "https://${APP_NAME}.babbi.world/" -o /dev/null
