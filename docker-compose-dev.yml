services:
  sumeetsaini_com:
    volumes:
      - ./services/sumeetsaini_com:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=dev
      
  vulkan:
    build:
      context: ./services/vulkan
      dockerfile: Dockerfile.dev
    volumes:
      - ./services/vulkan:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=dev
      - PORT=3000
      - HOST=0.0.0.0
      - FROM_EMAIL=vulkan@sumeetsaini.com
      - MAIL_ENABLED=true
      - CONTACT_EMAIL=dev-test@example.com
      - ETHEREAL_HOST=smtp.ethereal.email
      - ETHEREAL_PORT=587
      
  arcanecodex:
    build:
      context: ./services/arcanecodex
      dockerfile: Dockerfile.dev
    volumes:
      - ./services/arcanecodex:/src
      - /src/themes/PaperMod/.git
    ports:
      - "1313:1313"
    environment:
      - HUGO_ENV=development
      - HUGO_BASEURL=http://arcanecodex.localhost/
      - HUGO_ENABLE_ROBOTS=false
      
  gateway:
    volumes:
      - ./services/gateway/nginx-dev.conf:/etc/nginx/nginx.conf:ro
      - ./services/gateway/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
