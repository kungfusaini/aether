services:
  sumeetsaini_com:
    volumes:
      - ./services/sumeetsaini_com:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=dev

  vulkan:
    build:
      context: ./services/vulkan
      dockerfile: Dockerfile.dev
    volumes:
      - ./services/vulkan:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=dev
      - PORT=3000
      - HOST=0.0.0.0
      - FROM_EMAIL=vulkan@sumeetsaini.com
      - MAIL_ENABLED=true
      - CONTACT_EMAIL=dev-test@example.com
      - ETHEREAL_HOST=smtp.ethereal.email
      - ETHEREAL_PORT=587

  arcanecodex:
    build:
      context: ./services/arcanecodex
      dockerfile: Dockerfile.dev
    volumes:
      - ./services/arcanecodex:/src
    ports:
      - "1313:1313"
    environment:
      - HUGO_ENV=development

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    volumes:
      - ./services/gateway/nginx-dev.conf:/etc/nginx/nginx.conf:ro
      - ./services/gateway/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    depends_on:
      - sumeetsaini_com
      - vulkan
      - arcanecodex
